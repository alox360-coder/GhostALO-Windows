name: Inizializza progetto

# Da eseguire a mano (Actions -> Inizializza progetto -> Run workflow).
# Scrive nel repository i file sorgente di GhostALO per Windows e avvia la compilazione.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scrivi i file del progetto
        run: |
          mkdir -p "$(dirname '.gitignore')"
          cat > '.gitignore' <<'EOF_PRJ'
          __pycache__/
          *.pyc
          build/
          dist/
          *.spec
          EOF_PRJ
          mkdir -p "$(dirname 'README.md')"
          cat > 'README.md' <<'EOF_PRJ'
          # GhostALO per Windows (beta)

          Programma per Windows in stile terminale (verde su nero) per controllare sicurezza e privacy del PC e fare pulizia.
          Versione "gemella" dell'app Android GhostALO: stessa filosofia, ma è un programma scritto da zero.

          - **Controllo rapido**: un clic per vedere se qualcosa richiede attenzione. Distingue ciò che è stato controllato da ciò che non si è potuto verificare.
          - **Sicurezza del computer**: antivirus registrato, Windows Defender, firewall, aggiornamenti, UAC, Desktop remoto, Secure Boot, BitLocker, account amministratore.
          - **Controllo privacy**: programmi all'avvio, attività pianificate non Microsoft, programmi di accesso remoto o di monitoraggio, estensioni dei browser con accesso ampio, file hosts modificato, proxy di sistema.
          - **Pulizia**: file temporanei, rapporti di errore, miniature, cache dei browser, elenco dei file recenti, cookie, installer vecchi in Download. Si vede l'elenco, si conferma, e prima di eliminare si ricontrolla che i file non siano cambiati.
          - **File grandi e vecchi**: nella cartella utente, con soglia a scelta. I file vanno nel Cestino di Windows.

          Cache e temporanei si eliminano subito (i programmi li ricreano). I file dell'utente vanno sempre nel Cestino.

          ## Limiti

          - Non è un antivirus e non ha un database di malware: cerca indizi, non virus.
          - Alcuni controlli richiedono i permessi di amministratore; se non sono verificabili lo dice, non li dà per buoni.
          - Non invia nulla: non usa la rete.
          - Il file `.exe` non è firmato digitalmente: Windows può mostrare l'avviso SmartScreen ("Esegui comunque").

          ## Scaricare e verificare

          Gli `.exe` sono nella sezione **Releases**, con il file `GhostALO.exe.sha256`: confronta l'impronta SHA-256 del file scaricato.

          ## Sviluppo

          ```
          python -m unittest discover -s tests -v
          python -m PyInstaller --onefile --windowed --name GhostALO --paths src main.py
          ```

          I test girano anche fuori da Windows (con un'interfaccia finta). La compilazione avviene in GitHub Actions (`.github/workflows/build.yml`).
          EOF_PRJ
          mkdir -p "$(dirname 'main.py')"
          cat > 'main.py' <<'EOF_PRJ'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.path.dirname(os.path.abspath(__file__)), "src"))

          from ghostalo.ui import main  # noqa: E402

          if __name__ == "__main__":
              main()
          EOF_PRJ
          mkdir -p "$(dirname 'src/ghostalo/__init__.py')"
          cat > 'src/ghostalo/__init__.py' <<'EOF_PRJ'
          VERSION = "0.1.0"
          EOF_PRJ
          mkdir -p "$(dirname 'src/ghostalo/checks.py')"
          cat > 'src/ghostalo/checks.py' <<'EOF_PRJ'
          """Controlli di sicurezza e privacy. Tutto in locale; ciò che non si può verificare è 'na', mai 'ok'."""
          import datetime
          import glob
          import json
          import os
          import re

          from . import winutil
          from .i18n import tr, trf

          # stati: ok, info, warn, bad, na (non verificabile)
          RANK = {"ok": 0, "na": 0, "info": 1, "warn": 2, "bad": 3}


          class Check:
              def __init__(self, status, title, detail=""):
                  self.status = status
                  self.title = title
                  self.detail = detail


          # ---------------------------------------------------------------- sicurezza

          def _antivirus():
              rows = winutil.powershell_json(
                  "Get-CimInstance -Namespace root/SecurityCenter2 -ClassName AntivirusProduct "
                  "| Select-Object displayName | ConvertTo-Json -Compress"
              )
              if rows is None:
                  return Check("na", tr("Antivirus"), tr("Non sono riuscito a leggerlo."))
              names = sorted({str(r.get("displayName", "")).strip() for r in rows if r.get("displayName")})
              if not names:
                  return Check("warn", tr("Antivirus"), tr("Nessun antivirus registrato in Windows."))
              return Check("ok", tr("Antivirus"), ", ".join(names))


          def _defender():
              rows = winutil.powershell_json(
                  "Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureAge "
                  "| ConvertTo-Json -Compress"
              )
              if not rows:
                  return Check("na", tr("Windows Defender"), tr("Non risponde (forse usi un altro antivirus)."))
              r = rows[0]
              if r.get("RealTimeProtectionEnabled") is False:
                  return Check("warn", tr("Windows Defender"), tr("Protezione in tempo reale spenta."))
              age = r.get("AntivirusSignatureAge")
              if isinstance(age, int) and age > 7:
                  return Check("warn", tr("Windows Defender"), trf("Definizioni non aggiornate da %s giorni.", age))
              return Check("ok", tr("Windows Defender"), tr("Protezione attiva e aggiornata."))


          def _firewall():
              rows = winutil.powershell_json("Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json -Compress")
              if not rows:
                  return Check("na", tr("Firewall"), tr("Non sono riuscito a leggerlo."))
              off = [str(r.get("Name")) for r in rows if r.get("Enabled") in (False, 0)]
              if off:
                  return Check("warn", tr("Firewall"), tr("Spento per i profili: ") + ", ".join(off))
              return Check("ok", tr("Firewall"), tr("Attivo su tutti i profili."))


          def parse_hotfix_days(text, today=None):
              """Da 'AAAA-MM-GG' ai giorni trascorsi; None se non valido."""
              try:
                  d = datetime.datetime.strptime(text.strip(), "%Y-%m-%d").date()
              except (ValueError, AttributeError):
                  return None
              today = today or datetime.date.today()
              return (today - d).days


          def _updates():
              rc, out = winutil.powershell(
                  "(Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 1).InstalledOn.ToString('yyyy-MM-dd')"
              )
              days = parse_hotfix_days(out) if rc == 0 else None
              if days is None:
                  return Check("na", tr("Aggiornamenti di Windows"), tr("Data dell'ultimo aggiornamento non disponibile."))
              if days > 90:
                  return Check("warn", tr("Aggiornamenti di Windows"), trf("Ultimo aggiornamento installato %s giorni fa.", days))
              return Check("ok", tr("Aggiornamenti di Windows"), trf("Ultimo aggiornamento installato %s giorni fa.", days))


          def _uac():
              v = winutil.reg_get("HKLM", r"SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System", "EnableLUA")
              if v is None:
                  return Check("na", tr("Controllo account utente (UAC)"), tr("Non disponibile."))
              if v == 0:
                  return Check("bad", tr("Controllo account utente (UAC)"), tr("Disattivato: i programmi possono ottenere privilegi senza chiedere."))
              return Check("ok", tr("Controllo account utente (UAC)"), tr("Attivo."))


          def _rdp():
              v = winutil.reg_get("HKLM", r"SYSTEM\CurrentControlSet\Control\Terminal Server", "fDenyTSConnections")
              if v is None:
                  return Check("na", tr("Desktop remoto"), tr("Non disponibile."))
              if v == 0:
                  return Check("warn", tr("Desktop remoto"), tr("Attivo: se non ti serve, spegnilo (Impostazioni > Sistema > Desktop remoto)."))
              return Check("ok", tr("Desktop remoto"), tr("Spento."))


          def _secure_boot():
              v = winutil.reg_get("HKLM", r"SYSTEM\CurrentControlSet\Control\SecureBoot\State", "UEFISecureBootEnabled")
              if v is None:
                  return Check("na", tr("Avvio protetto (Secure Boot)"), tr("Non disponibile o PC con BIOS tradizionale."))
              if v == 1:
                  return Check("ok", tr("Avvio protetto (Secure Boot)"), tr("Attivo."))
              return Check("info", tr("Avvio protetto (Secure Boot)"), tr("Non attivo."))


          def _bitlocker():
              rc, out = winutil.powershell(
                  "(New-Object -ComObject Shell.Application).NameSpace($env:SystemDrive).Self."
                  "ExtendedProperty('System.Volume.BitLockerProtection')"
              )
              v = out.strip() if rc == 0 else ""
              if v == "1":
                  return Check("ok", tr("Cifratura del disco (BitLocker)"), tr("Attiva sul disco di sistema."))
              if v in ("0", "2"):
                  return Check(
                      "info", tr("Cifratura del disco (BitLocker)"),
                      tr("Non risulta attiva. Su un portatile proteggerebbe i dati in caso di furto (non è disponibile su tutte le edizioni di Windows)."),
                  )
              return Check("na", tr("Cifratura del disco (BitLocker)"), tr("Stato non verificabile."))


          def _admin_account():
              if winutil.is_admin():
                  return Check(
                      "info", tr("Account amministratore"),
                      tr("Stai usando il programma come amministratore. Per l'uso di tutti i giorni è più sicuro un account standard."),
                  )
              return Check("ok", tr("Account amministratore"), tr("Account standard in uso."))


          def run_security():
              out = []
              for f in (_antivirus, _defender, _firewall, _updates, _uac, _rdp, _secure_boot, _bitlocker, _admin_account):
                  try:
                      out.append(f())
                  except Exception:
                      out.append(Check("na", f.__name__.strip("_"), tr("Controllo non riuscito.")))
              return out


          # ---------------------------------------------------------------- privacy

          RISKY_DIRS = ("\\temp\\", "\\downloads\\", "\\appdata\\local\\temp", "\\users\\public\\")


          def classify_command(cmd):
              """'warn' se il comando parte da una cartella tipica del malware, altrimenti 'info'."""
              c = (cmd or "").lower().replace("/", "\\")
              if any(d in c for d in RISKY_DIRS):
                  return "warn"
              if "-enc" in c and "powershell" in c:
                  return "warn"
              return "info"


          def _startup():
              items = []
              keys = [
                  ("HKCU", r"Software\Microsoft\Windows\CurrentVersion\Run"),
                  ("HKLM", r"SOFTWARE\Microsoft\Windows\CurrentVersion\Run"),
                  ("HKLM", r"SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run"),
              ]
              for hive, path in keys:
                  for name, val in winutil.reg_values(hive, path):
                      items.append(Check(classify_command(str(val)), str(name), str(val)))
              startup_dirs = [
                  winutil.pj(os.environ.get("APPDATA", ""), r"Microsoft\Windows\Start Menu\Programs\Startup"),
                  winutil.pj(os.environ.get("PROGRAMDATA", ""), r"Microsoft\Windows\Start Menu\Programs\Startup"),
              ]
              for d in startup_dirs:
                  if d and os.path.isdir(d):
                      for f in sorted(os.listdir(d)):
                          if f.lower() != "desktop.ini":
                              items.append(Check("info", f, d))
              return items


          def _tasks():
              rows = winutil.powershell_json(
                  "Get-ScheduledTask | Where-Object { $_.TaskPath -notlike '\\Microsoft\\*' } | ForEach-Object { "
                  "[pscustomobject]@{Name=$_.TaskName; Exec=(($_.Actions | Select-Object -First 1 | "
                  "ForEach-Object { $_.Execute + ' ' + $_.Arguments }))} } | ConvertTo-Json -Compress",
                  timeout=40,
              )
              if rows is None:
                  return None
              return [Check(classify_command(str(r.get("Exec"))), str(r.get("Name")), str(r.get("Exec") or "").strip()) for r in rows]


          REMOTE_TOOLS = (
              "anydesk", "teamviewer", "ultraviewer", "rustdesk", "ammyy", "logmein", "realvnc", "tightvnc",
              "ultravnc", "remote utilities", "radmin", "splashtop", "supremo", "chrome remote desktop", "screenconnect",
          )
          MONITOR_TOOLS = (
              "kidlogger", "spyrix", "refog", "actual spy", "ardamax", "spytech", "keylogger", "revealer", "pc monitor",
              "employee monitoring", "spyagent",
          )


          def classify_program(name):
              n = (name or "").lower()
              if any(k in n for k in MONITOR_TOOLS):
                  return "warn"
              if any(k in n for k in REMOTE_TOOLS):
                  return "info"
              return None


          def installed_programs():
              names = set()
              paths = [
                  ("HKLM", r"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"),
                  ("HKLM", r"SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"),
                  ("HKCU", r"Software\Microsoft\Windows\CurrentVersion\Uninstall"),
              ]
              for hive, base in paths:
                  for sub in winutil.reg_subkeys(hive, base):
                      n = winutil.reg_get(hive, base + "\\" + sub, "DisplayName")
                      if n:
                          names.add(str(n))
              return sorted(names)


          def _remote_tools():
              found = []
              for n in installed_programs():
                  c = classify_program(n)
                  if c:
                      found.append(Check(c, n, tr("Programma installato.")))
              for p in sorted(winutil.running_processes()):
                  c = classify_program(p.replace(".exe", ""))
                  if c:
                      found.append(Check(c, p, tr("In esecuzione adesso.")))
              return found


          def parse_manifest(text):
              """Estrae (nome, accesso_ampio) da un manifest di estensione; None se non valido."""
              try:
                  m = json.loads(text)
              except ValueError:
                  return None
              name = str(m.get("name", ""))
              perms = [str(p) for p in m.get("permissions", []) if isinstance(p, str)]
              perms += [str(p) for p in m.get("host_permissions", []) if isinstance(p, str)]
              for cs in m.get("content_scripts", []) or []:
                  perms += [str(p) for p in cs.get("matches", []) if isinstance(p, str)]
              broad = any(p in ("<all_urls>", "*://*/*", "http://*/*", "https://*/*") for p in perms)
              return name, broad


          def _extensions():
              local = os.environ.get("LOCALAPPDATA", "")
              roots = {
                  "Chrome": r"Google\Chrome\User Data",
                  "Edge": r"Microsoft\Edge\User Data",
                  "Brave": r"BraveSoftware\Brave-Browser\User Data",
              }
              out = []
              for browser, rel in roots.items():
                  base = winutil.pj(local, rel)
                  for manifest in glob.glob(os.path.join(base, "*", "Extensions", "*", "*", "manifest.json")):
                      try:
                          with open(manifest, encoding="utf-8-sig") as f:
                              parsed = parse_manifest(f.read())
                      except OSError:
                          continue
                      if not parsed:
                          continue
                      name, broad = parsed
                      ext_id = manifest.split(os.sep)[-3]
                      if name.startswith("__MSG_"):
                          name = ext_id
                      out.append(Check(
                          "info" if broad else "ok", "%s: %s" % (browser, name),
                          tr("Può leggere tutti i siti che visiti.") if broad else tr("Accesso limitato."),
                      ))
              return out


          def parse_hosts(text):
              """Righe attive del file hosts (esclusi commenti e localhost)."""
              out = []
              for line in text.splitlines():
                  line = line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  parts = line.split()
                  if len(parts) >= 2 and all(h.lower() not in ("localhost", "localhost.localdomain", "broadcasthost") for h in parts[1:]):
                      out.append(line)
              return out


          def _hosts():
              path = winutil.pj(os.environ.get("SystemRoot", r"C:\Windows"), r"System32\drivers\etc\hosts")
              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      return parse_hosts(f.read())
              except OSError:
                  return None


          def _proxy():
              enabled = winutil.reg_get("HKCU", r"Software\Microsoft\Windows\CurrentVersion\Internet Settings", "ProxyEnable")
              server = winutil.reg_get("HKCU", r"Software\Microsoft\Windows\CurrentVersion\Internet Settings", "ProxyServer")
              if enabled is None:
                  return Check("na", tr("Proxy di sistema"), tr("Non disponibile."))
              if enabled == 1:
                  return Check("warn", tr("Proxy di sistema"), tr("Attivo: ") + str(server) + tr(". Se non l'hai impostato tu, il traffico potrebbe passare da altri."))
              return Check("ok", tr("Proxy di sistema"), tr("Nessun proxy impostato."))


          class PrivacyReport:
              def __init__(self):
                  self.startup = []
                  self.tasks = None
                  self.remote = []
                  self.extensions = []
                  self.hosts = None
                  self.proxy = None

              def findings(self):
                  """Le voci che richiedono attenzione (warn o info rilevanti), con la sezione."""
                  out = []
                  for c in self.startup:
                      if c.status == "warn":
                          out.append(Check("warn", tr("Avvio automatico: ") + c.title, c.detail))
                  for c in (self.tasks or []):
                      if c.status == "warn":
                          out.append(Check("warn", tr("Attività pianificata: ") + c.title, c.detail))
                  for c in self.remote:
                      out.append(Check(c.status, tr("Accesso remoto o monitoraggio: ") + c.title, c.detail))
                  if self.hosts:
                      out.append(Check("info", tr("File hosts modificato"), trf("%s righe personalizzate.", len(self.hosts))))
                  if self.proxy and self.proxy.status in ("warn", "bad"):
                      out.append(self.proxy)
                  return out

              def incomplete(self):
                  return self.tasks is None or self.hosts is None or (self.proxy is not None and self.proxy.status == "na")


          def run_privacy():
              r = PrivacyReport()
              steps = [
                  ("startup", _startup), ("tasks", _tasks), ("remote", _remote_tools),
                  ("extensions", _extensions), ("hosts", _hosts), ("proxy", _proxy),
              ]
              for attr, fn in steps:
                  try:
                      setattr(r, attr, fn())
                  except Exception:
                      setattr(r, attr, None if attr in ("tasks", "hosts", "proxy") else [])
              return r
          EOF_PRJ
          mkdir -p "$(dirname 'src/ghostalo/cleaner.py')"
          cat > 'src/ghostalo/cleaner.py' <<'EOF_PRJ'
          """Pulizia con anteprima. Mai alla cieca: si scansiona, si mostra, si conferma, poi si elimina.

          Due modalità:
          - 'delete': dati che i programmi ricreano da soli (temporanei, cache). Eliminati subito.
          - 'recycle': file dell'utente (Download, file grandi). Vanno nel Cestino di Windows.
          Prima di eliminare si ricontrolla che ogni file non sia cambiato dopo la scansione.
          """
          import glob
          import os
          import threading
          import time

          from . import winutil
          from .i18n import tr

          DAY = 86400
          MAX_VISITED = 400000


          class Cancelled(Exception):
              pass


          class Item:
              def __init__(self, path, size, mtime):
                  self.path = path
                  self.size = size
                  self.mtime = mtime


          class Category:
              def __init__(self, key, title, hint, mode, checked, roots, processes=()):
                  self.key = key
                  self.title = title
                  self.hint = hint
                  self.mode = mode          # 'delete' | 'recycle'
                  self.checked = checked
                  self.roots = roots        # cartelle in cui sono ammessi i file (sicurezza)
                  self.processes = processes  # programmi da chiudere prima (nomi .exe in minuscolo)
                  self.items = []

              @property
              def bytes(self):
                  return sum(i.size for i in self.items)

              @property
              def count(self):
                  return len(self.items)


          class Result:
              def __init__(self):
                  self.freed = 0
                  self.failed = 0
                  self.changed = 0
                  self.recycled = 0


          def _check(cancel):
              if cancel is not None and cancel.is_set():
                  raise Cancelled()


          def walk_files(root, cancel=None, limit=MAX_VISITED, skip_dirs=()):
              """Genera (percorso, dimensione, data) dei file sotto root, senza seguire collegamenti o giunzioni."""
              stack = [root]
              visited = 0
              skip = {s.lower() for s in skip_dirs}
              while stack and visited < limit:
                  _check(cancel)
                  d = stack.pop()
                  try:
                      it = os.scandir(d)
                  except OSError:
                      continue
                  with it:
                      for e in it:
                          visited += 1
                          try:
                              if e.is_symlink() or getattr(e, "is_junction", lambda: False)():
                                  continue
                              if e.is_dir(follow_symlinks=False):
                                  if e.name.lower() in skip:
                                      continue
                                  stack.append(e.path)
                              elif e.is_file(follow_symlinks=False):
                                  st = e.stat(follow_symlinks=False)
                                  yield e.path, st.st_size, st.st_mtime
                          except OSError:
                              continue


          def _under(path, roots):
              try:
                  rp = os.path.realpath(path)
                  for r in roots:
                      rr = os.path.realpath(r)
                      if rp == rr or rp.startswith(rr.rstrip("\\/") + os.sep):
                          return True
              except OSError:
                  pass
              return False


          def default_env():
              e = os.environ
              home = e.get("USERPROFILE") or os.path.expanduser("~")
              return {
                  "TEMP": e.get("TEMP") or os.path.join(home, "AppData", "Local", "Temp"),
                  "LOCALAPPDATA": e.get("LOCALAPPDATA") or os.path.join(home, "AppData", "Local"),
                  "APPDATA": e.get("APPDATA") or os.path.join(home, "AppData", "Roaming"),
                  "USERPROFILE": home,
              }


          BROWSERS = {
              # nome: (cartella dati in LOCALAPPDATA, processo)
              "Chrome": (r"Google\Chrome\User Data", "chrome.exe"),
              "Edge": (r"Microsoft\Edge\User Data", "msedge.exe"),
              "Brave": (r"BraveSoftware\Brave-Browser\User Data", "brave.exe"),
          }


          def _profiles(base):
              out = []
              for name in ("Default",) + tuple("Profile %d" % i for i in range(1, 10)):
                  p = os.path.join(base, name)
                  if os.path.isdir(p):
                      out.append(p)
              return out


          def _firefox_profiles(root):
              return [p for p in glob.glob(os.path.join(root, "*")) if os.path.isdir(p)]


          def build_categories(env=None):
              """Crea le categorie (vuote) con le cartelle in cui possono lavorare."""
              env = env or default_env()
              local, roam, home, temp = env["LOCALAPPDATA"], env["APPDATA"], env["USERPROFILE"], env["TEMP"]
              # Sicurezza: se TEMP punta fuori dal profilo utente (es. una cartella radice), non lo si usa.
              if not _under(temp, [home, local]):
                  temp = os.path.join(local, "Temp")

              cats = []
              cats.append(Category("temp", tr("File temporanei"), tr("Cartella Temp dell'utente: file più vecchi di un giorno che i programmi ricreano."),
                                   "delete", True, [temp]))
              cats.append(Category("dumps", tr("Rapporti di errore e dump"), tr("Dump di crash e rapporti di errore di Windows."),
                                   "delete", True,
                                   [os.path.join(local, "CrashDumps"), winutil.pj(local, r"Microsoft\Windows\WER")]))
              cats.append(Category("thumbs", tr("Miniature e icone in cache"), tr("Cache di Esplora file: Windows la ricrea se serve."),
                                   "delete", True, [winutil.pj(local, r"Microsoft\Windows\Explorer")]))
              cache_roots = []
              procs = []
              for name, (rel, proc) in BROWSERS.items():
                  base = winutil.pj(local, rel)
                  for prof in _profiles(base):
                      for sub in ("Cache", "Code Cache", "GPUCache"):
                          cache_roots.append(os.path.join(prof, sub))
                  procs.append(proc)
              cache_roots += [os.path.join(p, "cache2") for p in _firefox_profiles(winutil.pj(local, r"Mozilla\Firefox\Profiles"))]
              procs.append("firefox.exe")
              cats.append(Category("browser", tr("Cache dei browser"), tr("Cache di Chrome, Edge, Brave e Firefox. Chiudi il browser prima."),
                                   "delete", True, cache_roots, tuple(procs)))
              cats.append(Category("recent", tr("Elenco dei file recenti"), tr("Cronologia di Windows dei file aperti di recente (privacy)."),
                                   "delete", False,
                                   [winutil.pj(roam, r"Microsoft\Windows\Recent")]))
              cookie_roots = []
              for name, (rel, _p) in BROWSERS.items():
                  base = winutil.pj(local, rel)
                  for prof in _profiles(base):
                      cookie_roots.append(os.path.join(prof, "Network"))
              cookie_roots += _firefox_profiles(winutil.pj(roam, r"Mozilla\Firefox\Profiles"))
              cats.append(Category("cookies", tr("Cookie dei browser"), tr("Attenzione: dopo averli eliminati vieni disconnesso dai siti. Chiudi il browser prima."),
                                   "delete", False, cookie_roots, tuple(procs)))
              cats.append(Category("installers", tr("Installer vecchi in Download"),
                                   tr("File .exe, .msi, .iso e archivi in Download non modificati da oltre 90 giorni. Vanno nel Cestino."),
                                   "recycle", False, [os.path.join(home, "Downloads")]))
              return cats


          COOKIE_NAMES = ("cookies", "cookies-journal", "cookies.sqlite", "cookies.sqlite-wal", "cookies.sqlite-shm")
          INSTALLER_EXT = (".exe", ".msi", ".msix", ".iso", ".zip", ".rar", ".7z")


          def _accept(cat, path, mtime, now):
              name = os.path.basename(path).lower()
              if cat.key == "temp":
                  return now - mtime > DAY
              if cat.key == "dumps":
                  return True
              if cat.key == "thumbs":
                  return name.startswith(("thumbcache_", "iconcache_"))
              if cat.key == "browser":
                  return True
              if cat.key == "recent":
                  return name.endswith(".lnk") or "destinations" in path.lower()
              if cat.key == "cookies":
                  return name in COOKIE_NAMES
              if cat.key == "installers":
                  return name.endswith(INSTALLER_EXT) and now - mtime > 90 * DAY
              return False


          def scan(cats, cancel=None, now=None):
              """Riempie le categorie. Non modifica nulla."""
              now = now or time.time()
              for cat in cats:
                  cat.items = []
                  seen = set()
                  for root in cat.roots:
                      if not os.path.isdir(root):
                          continue
                      for path, size, mtime in walk_files(root, cancel):
                          if path in seen:
                              continue
                          if _accept(cat, path, mtime, now):
                              seen.add(path)
                              cat.items.append(Item(path, size, mtime))
              return [c for c in cats if c.count > 0]


          def scan_big(root, min_mb, age_days, cancel=None, now=None, limit_results=40):
              """File grandi e non modificati da tempo nel profilo utente (esclusa AppData). Non modifica nulla."""
              now = now or time.time()
              cat = Category("big", tr("File grandi e vecchi"), tr("File pesanti non modificati da tempo. Vanno nel Cestino."),
                             "recycle", False, [root])
              min_bytes = min_mb * 1024 * 1024
              found = []
              for path, size, mtime in walk_files(root, cancel, skip_dirs=("AppData", "$Recycle.Bin")):
                  if size >= min_bytes and now - mtime > age_days * DAY:
                      found.append(Item(path, size, mtime))
              found.sort(key=lambda i: i.size, reverse=True)
              cat.items = found[:limit_results]
              return cat


          def process_running(cat):
              if not cat.processes:
                  return []
              running = winutil.running_processes()
              return sorted(p for p in cat.processes if p in running)


          def delete(cats, cancel=None):
              """Elimina gli elementi delle categorie. Ricontrolla ogni file prima di toccarlo."""
              res = Result()
              for cat in cats:
                  for it in cat.items:
                      _check(cancel)
                      try:
                          st = os.stat(it.path, follow_symlinks=False)
                      except OSError:
                          continue  # già sparito
                      if st.st_size != it.size or abs(st.st_mtime - it.mtime) > 1.0:
                          res.changed += 1
                          continue
                      if os.path.islink(it.path) or not _under(it.path, cat.roots):
                          res.failed += 1
                          continue
                      if cat.mode == "recycle":
                          if winutil.recycle(it.path):
                              res.recycled += it.size
                          else:
                              res.failed += 1
                      else:
                          try:
                              os.remove(it.path)
                              res.freed += it.size
                          except OSError:
                              res.failed += 1
              return res
